model:
  mode: scratch
  dropout: 0.5
  num_classes: 2

data:
  manifest: data/processed/manifest.json     # используется только для снапшота
  processed_dir: data/processed
  image_size: 224
  batch_size: 64
  num_workers: 4

augment:
  image_size: 224
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std:  [0.229, 0.224, 0.225]
  jpeg_quality_lower: 50
  jpeg_quality_upper: 95
  jpeg_p: 0.3

train:
  epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  early_stopping_patience: 10
  amp: true
  seed: 42

paths:
  runs_dir: runs
  checkpoints_dir: checkpoints
  run_name: scratch_hardaug_v2